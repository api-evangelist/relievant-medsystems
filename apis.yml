name: Relievant Medsystems
description: >-
  Relievant Medsystems is a medical device company that developed the Intracept
  Procedure, a minimally invasive treatment that uses radiofrequency ablation of
  the basivertebral nerve to relieve chronic vertebrogenic low back pain.
  Originally venture-backed (including by Canaan Partners), Relievant was acquired
  by Boston Scientific in 2023, and the Intracept system is now marketed under the
  Boston Scientific portfolio. The company is a clinical medical-device business
  focused on physicians, hospitals, and patients rather than a software or API
  platform, and it publishes no public developer API, SDK, or technical
  integration surface.
